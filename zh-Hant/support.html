<main><article class="prose"><h1>聯絡支援</h1><p>請提供裝置型號、系統版本、App 版本和重現步驟。傳送截圖前請先遮蔽個人資料。</p><p><a href="mailto:guogxy@hotmail.com" class="button primary">guogxy@hotmail.com</a></p><section><h2>無法下載模型</h2><p>在「設定 → 語言模型」檢查翻譯引擎、網路和剩餘空間。已安裝的模型可離線使用。</p></section>
<section><h2>想重新裁切掃描件</h2><p>開啟專案，選擇裁邊並調整四角，再重新預覽與匯出。</p></section>
<section><h2>預覽與匯出</h2><p>進入專案的匯出畫面，選擇格式和檔案大小。可編輯備份保留原件和編輯記錄。</p></section></article></main>
