<main><article class="prose"><h1>联系支持</h1><p>遇到问题时，请注明设备型号、系统版本、App 版本和复现步骤。发送截图前请遮挡个人资料。</p><p><a href="mailto:guogxy@hotmail.com" class="button primary">guogxy@hotmail.com</a></p><section><h2>模型无法下载</h2><p>在「设置 → 语言模型」检查所选引擎、网络和剩余空间。已安装的模型可离线使用。</p></section>
<section><h2>想重新裁切扫描件</h2><p>打开项目，进入「裁边」并调整角点。确认后可重新预览和导出。</p></section>
<section><h2>预览和导出</h2><p>从项目的「导出」选择格式和文件大小。可编辑项目备份保留原件与编辑过程。</p></section></article></main>
